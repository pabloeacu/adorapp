  <meta name="apple-mobile-web-app-title" content="AdorAPP">

  <!-- Canonical -->

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AdorAPP — La plataforma de Adoración CAF">
  <meta property="og:description" content="Gestiona órdenes de servicio, repertorio de canciones, bandas y miembros del Ministerio de Adoración del Centro de Avivamiento Familiar.">

  <meta property="og:site_name" content="AdorAPP">
  <meta property="og:image" content="https://adorapp.net.ar/adorapp-logo.png">
  <meta property="og:locale" content="es_AR">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="AdorAPP — La plataforma de Adoración CAF">
  <meta name="twitter:description" content="Gestiona órdenes de servicio, repertorio de canciones, bandas y miembros del Ministerio de Adoración del Centro de Avivamiento Familiar.">
  <meta name="twitter:image" content="https://adorapp.net.ar/adorapp-logo.png">

  <!-- Favicon — ícono de Adoración CAF (el mismo que se ve al instalar la app) -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="shortcut icon" type="image/png" href="/icon-192.png">

  <!-- Apple Touch Icons (Add to Home Screen — usan logo Adoración CAF) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icon-180.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Preconexión al servidor de datos: abre el handshake TLS con Supabase durante el
       parseo del HTML, antes de que el arranque dispare sus primeros pedidos. -->
  <link rel="preconnect" href="https://gvsoexomzfaimagnaqzm.supabase.co" crossorigin>
  <!-- Fuentes self-hosted (ver @font-face en src/index.css): ya NO bloqueamos el primer
       pintado con Google Fonts. Precargamos Inter (la del cuerpo, en el camino crítico);
       Caveat (solo anotaciones) carga on-demand. -->
  <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Structured data: who runs the platform. Helps social/search platforms surface the right entity. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Centro de Avivamiento Familiar",
    "alternateName": "CAF",
    "url": "https://adorapp.net.ar",
    "logo": "https://adorapp.net.ar/adoracion-caf-logo.png",
    "description": "Ministerio de Adoración del Centro de Avivamiento Familiar — plataforma para coordinar órdenes de servicio, repertorio y equipos."
  }
  </script>

  <title>AdorAPP — La plataforma de Adoración CAF</title>

  <!-- Red de seguridad del ARRANQUE: si el script o el CSS de entrada (con el hash de esta
       versión) ya no existe porque se acaba de publicar otra, sin React no hay quien lo
       atrape y la app quedaría en negro. Recarga UNA vez (la recarga trae el index.html nuevo)
       compartiendo la marca anti-loop con src/lib/chunkRecovery.js y avisando a la pantalla
       "Actualizando a la nueva versión". -->
  <script>
  (function () {
    try {
      var K = 'adorapp:chunk-retry', U = 'adorapp:update', R = 'adorapp:chunk-recovered';
      window.addEventListener('error', function (e) {
        var t = e && e.target; if (!t || !t.tagName) return;
        var src = t.tagName === 'SCRIPT' ? t.src : (t.tagName === 'LINK' && t.rel === 'stylesheet' ? t.href : '');
        if (!src || src.indexOf('/assets/') < 0) return;
        var now = Date.now(), at = Number(sessionStorage.getItem(K)) || 0;
        if (now - at < 60000) return;
        sessionStorage.setItem(K, String(now));
        sessionStorage.setItem(U, JSON.stringify({ at: now, step: 'reloading' }));
        sessionStorage.setItem(R, JSON.stringify({ at: now, kind: 'entry', path: location.pathname, asset: src.slice(src.indexOf('/assets/')) }));
        location.reload();
      }, true);
    } catch (_) { /* noop */ }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
